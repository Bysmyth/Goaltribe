<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalTribe - Zirkel App</title>

    <!-- PWA Settings (Mobile App Look) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GoalTribe">
    <meta name="theme-color" content="#465846">

    <!-- Apple Touch Icon (Für iPhone Startbildschirm) -->
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Inline Manifest mit Verweis auf dein icon.png -->
    <!-- Apple Touch Icon -->
<link rel="apple-touch-icon" href="./icon.png">

<link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 50: '#f4f7f4', 100: '#e3eae3', 500: '#738a73', 600: '#586f58', 700: '#465846', 800: '#384638', 900: '#2d382d' },
                        bamboo: { 100: '#f2f5e8', 400: '#a3c663', 500: '#8ba858', 600: '#6f8b3c' },
                        earth: { 50: '#faf7f2', 100: '#f3ece2', 200: '#e5d7c4', 800: '#5c4a3e' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #faf7f2; user-select: none; }
    </style>
</head>
<body class="text-earth-800 min-h-screen pb-16">

    <!-- MODAL FÜR RAUM-EINGABE -->
    <div id="login-modal" class="fixed inset-0 bg-sage-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-xl border border-earth-200">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-sage-100 text-sage-700 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-users-rays"></i>
                </div>
                <h2 class="text-lg font-bold text-sage-900">Zirkel beitreten</h2>
                <p class="text-xs text-sage-600">Gib deinen Namen und den gemeinsamen Raum-Code ein.</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-sage-700">Dein Name</label>
                    <input type="text" id="login-user-name" placeholder="z. B. Lisa" class="w-full bg-earth-50 border border-earth-200 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-sage-500">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-sage-700">Raum-Code (Gemeinsamer Name)</label>
                    <input type="text" id="login-room-code" placeholder="z. B. unser-zirkel" class="w-full bg-earth-50 border border-earth-200 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-sage-500">
                </div>
                <button onclick="joinRoom()" class="w-full bg-sage-700 hover:bg-sage-800 text-white font-bold text-xs py-3 rounded-xl transition shadow-sm">
                    Raum betreten
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-sage-700 text-earth-50 p-4 shadow-md sticky top-0 z-50 border-b border-sage-600">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-sage-800 rounded-lg p-1.5 flex items-center justify-center shadow-inner border border-sage-600">
                    <svg viewBox="0 0 24 24" class="w-full h-full text-bamboo-400 fill-current">
                        <rect x="7" y="3" width="3" height="18" rx="1.5"/>
                        <rect x="14" y="6" width="3" height="15" rx="1.5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-none">GoalTribe</h1>
                    <p id="room-display-tag" class="text-[10px] text-sage-100 opacity-80 pt-0.5">Zirkel: --</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-sage-800/60 px-2.5 py-1.5 rounded-xl border border-sage-600">
                    <i class="fa-solid fa-leaf text-xs text-bamboo-400"></i>
                    <span id="my-name-display" class="text-xs font-medium text-earth-50">Ich</span>
                </div>
                <button onclick="leaveRoom()" title="Raum verlassen" class="bg-sage-800/80 hover:bg-rose-900/80 text-rose-200 border border-sage-600 text-xs w-7 h-7 rounded-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- KALENDER NAVIGATION -->
        <section class="bg-earth-100 p-3 rounded-2xl border border-earth-200 flex items-center justify-between shadow-sm">
            <button onclick="changeDate(-1)" class="w-8 h-8 rounded-full bg-white text-sage-700 shadow-sm flex items-center justify-center hover:bg-sage-50 transition">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>

            <div class="text-center">
                <div id="selected-date-display" class="font-bold text-sm text-sage-900">Heute</div>
                <div id="selected-date-sub" class="text-[10px] text-sage-600 font-medium">--</div>
            </div>

            <div class="flex items-center gap-1">
                <button onclick="resetToToday()" class="text-[10px] bg-sage-600 text-white px-2.5 py-1 rounded-md hover:bg-sage-700 transition font-medium">Heute</button>
                <button onclick="changeDate(1)" class="w-8 h-8 rounded-full bg-white text-sage-700 shadow-sm flex items-center justify-center hover:bg-sage-50 transition">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </section>

        <!-- GRUPPENÜBERSICHT -->
        <section class="space-y-4">
            <h2 class="text-base font-bold text-sage-900 flex items-center gap-2">
                <i class="fa-solid fa-users text-sage-600"></i> Zirkel-Mitglieder
            </h2>

            <div id="members-container" class="space-y-4">
                <!-- Dynamische Karten -->
            </div>
        </section>

    </main>

    <script>
        let currentDate = new Date();
        let myUserId = localStorage.getItem("gt_user_id");
        let myUserName = localStorage.getItem("gt_user_name");
        let currentRoomCode = localStorage.getItem("gt_room_code");

        let syncChannel = null;

        function getFormattedDateKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getRoomState() {
            if (!currentRoomCode) return { members: {} };
            const stored = localStorage.getItem("gt_data_" + currentRoomCode);
            return stored ? JSON.parse(stored) : { members: {} };
        }

        function saveRoomState(data) {
            if (!currentRoomCode) return;
            localStorage.setItem("gt_data_" + currentRoomCode, JSON.stringify(data));
            if (syncChannel) {
                syncChannel.postMessage("update");
            }
            render();
        }

        function initApp() {
            if (currentRoomCode && myUserId && myUserName) {
                document.getElementById("login-modal").classList.add("hidden");
                document.getElementById("room-display-tag").innerText = `Zirkel: ${currentRoomCode}`;
                document.getElementById("my-name-display").innerText = myUserName;

                if (window.BroadcastChannel) {
                    syncChannel = new BroadcastChannel("gt_channel_" + currentRoomCode);
                    syncChannel.onmessage = () => {
                        render();
                    };
                }

                const roomData = getRoomState();
                if (!roomData.members[myUserId]) {
                    roomData.members[myUserId] = {
                        id: myUserId,
                        name: myUserName,
                        habits: [
                            { id: "h1", name: "Russisch lernen", streak: 0, history: {} },
                            { id: "h2", name: "30 Min. Sport", streak: 0, history: {} }
                        ]
                    };
                    saveRoomState(roomData);
                } else {
                    render();
                }

            } else {
                document.getElementById("login-modal").classList.remove("hidden");
            }
        }

        function joinRoom() {
            const nameInput = document.getElementById("login-user-name").value.trim();
            const roomInput = document.getElementById("login-room-code").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");

            if (!nameInput || !roomInput) {
                alert("Bitte gib deinen Namen und einen Raum-Code ein!");
                return;
            }

            myUserId = "user_" + Date.now();
            myUserName = nameInput;
            currentRoomCode = roomInput;

            localStorage.setItem("gt_user_id", myUserId);
            localStorage.setItem("gt_user_name", myUserName);
            localStorage.setItem("gt_room_code", currentRoomCode);

            initApp();
        }

        function leaveRoom() {
            if (confirm("Möchtest du diesen Raum wirklich verlassen?")) {
                localStorage.removeItem("gt_room_code");
                currentRoomCode = null;
                location.reload();
            }
        }

        function updateDateHeader() {
            const dateKey = getFormattedDateKey(currentDate);
            const todayKey = getFormattedDateKey(new Date());

            const displayEl = document.getElementById("selected-date-display");
            const subEl = document.getElementById("selected-date-sub");

            subEl.innerText = currentDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });

            if (dateKey === todayKey) {
                displayEl.innerText = "Heute";
            } else {
                const diffTime = currentDate.getTime() - new Date().setHours(0,0,0,0);
                const diffDays = Math.round(diffTime / (1000 * 3600 * 24));
                if (diffDays === -1) displayEl.innerText = "Gestern";
                else if (diffDays === 1) displayEl.innerText = "Morgen";
                else displayEl.innerText = currentDate.toLocaleDateString('de-DE', { weekday: 'long' });
            }
        }

        function render() {
            updateDateHeader();
            const dateKey = getFormattedDateKey(currentDate);
            const container = document.getElementById("members-container");
            container.innerHTML = "";

            const roomData = getRoomState();
            const membersList = Object.values(roomData.members || {});

            if (membersList.length === 0) {
                container.innerHTML = `<p class="text-xs text-sage-500 text-center py-4">Keine Mitglieder im Raum.</p>`;
                return;
            }

            membersList.forEach(member => {
                const isMe = member.id === myUserId;
                const habitsList = member.habits || [];

                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl p-4 shadow-sm border border-earth-200/80 space-y-3";

                let habitsHTML = habitsList.map(habit => {
                    const status = (habit.history && habit.history[dateKey]) ? habit.history[dateKey] : "pending";
                    const isDone = status === 'done';
                    const isFailed = status === 'failed';
                    const streak = habit.streak || 0;

                    return `
                        <div class="p-2.5 rounded-xl bg-earth-50/60 border border-earth-200/50 flex items-center justify-between text-xs">
                            <div class="flex items-center gap-2">
                                <span class="font-medium text-earth-800">${habit.name}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md ${streak > 0 ? 'bg-amber-100 text-amber-800' : 'bg-earth-100 text-earth-800 opacity-60'}">
                                    🔥 ${streak}
                                </span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                ${isMe ? `
                                    <button onclick="setHabitStatus('${habit.id}', 'done')" class="w-8 h-8 rounded-lg flex items-center justify-center transition border ${isDone ? 'bg-sage-600 text-white border-sage-600 shadow-sm' : 'bg-white text-earth-200 border-earth-200 hover:text-sage-600'}">
                                        <i class="fa-solid fa-arrow-up text-xs"></i>
                                    </button>
                                    <button onclick="setHabitStatus('${habit.id}', 'failed')" class="w-8 h-8 rounded-lg flex items-center justify-center transition border ${isFailed ? 'bg-rose-700 text-white border-rose-700 shadow-sm' : 'bg-white text-earth-200 border-earth-200 hover:text-rose-600'}">
                                        <i class="fa-solid fa-arrow-down text-xs"></i>
                                    </button>
                                    <button onclick="deleteHabit('${habit.id}')" class="w-6 h-6 text-earth-200 hover:text-rose-500 transition ml-1">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                ` : `
                                    <span class="text-xs px-2 py-1 rounded-md font-bold ${isDone ? 'text-sage-600 bg-sage-50' : isFailed ? 'text-rose-600 bg-rose-50' : 'text-earth-400'}">
                                        ${isDone ? '✓ Erledigt' : isFailed ? '✕ Verfehlt' : 'Offen'}
                                    </span>
                                `}
                            </div>
                        </div>
                    `;
                }).join("");

                if (habitsList.length === 0) {
                    habitsHTML = `<p class="text-xs text-sage-500 italic py-1">Noch keine Aktivitäten eintragen.</p>`;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-earth-100 pb-2">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-full ${isMe ? 'bg-sage-600 text-white' : 'bg-sage-100 text-sage-700'} flex items-center justify-center text-xs font-bold">
                                ${member.name.charAt(0).toUpperCase()}
                            </div>
                            <span class="font-bold text-sm text-sage-900">${member.name}</span>
                            ${isMe ? '<span class="text-[9px] bg-bamboo-100 text-bamboo-600 font-bold px-1.5 py-0.5 rounded-full">DU</span>' : ''}
                        </div>
                    </div>

                    ${isMe ? `
                        <div class="flex gap-1.5 pt-1">
                            <input type="text" id="input-new-habit" placeholder="Aktivität hinzufügen..." class="w-full bg-earth-50 border border-earth-200 rounded-xl p-2 text-xs focus:outline-none focus:ring-1 focus:ring-sage-500">
                            <button onclick="addHabit()" class="bg-sage-700 hover:bg-sage-800 text-white text-xs px-3 rounded-xl transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    ` : ''}

                    <div class="space-y-1.5 pt-1">
                        ${habitsHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function addHabit() {
            const input = document.getElementById("input-new-habit");
            if (!input) return;
            const name = input.value.trim();
            if (!name) return;

            const roomData = getRoomState();
            if (roomData.members[myUserId]) {
                roomData.members[myUserId].habits.push({
                    id: "h_" + Date.now(),
                    name: name,
                    streak: 0,
                    history: {}
                });
                saveRoomState(roomData);
            }
            input.value = "";
        }

        function setHabitStatus(habitId, targetStatus) {
            const dateKey = getFormattedDateKey(currentDate);
            const roomData = getRoomState();
            const myMember = roomData.members[myUserId];

            if (!myMember) return;
            const habit = myMember.habits.find(h => h.id === habitId);
            if (!habit) return;

            if (!habit.history) habit.history = {};
            const currentStatus = habit.history[dateKey] || "pending";

            if (currentStatus === targetStatus) {
                habit.history[dateKey] = "pending";
                if (targetStatus === 'done') habit.streak = Math.max(0, (habit.streak || 0) - 1);
            } else {
                habit.history[dateKey] = targetStatus;
                if (targetStatus === 'done') habit.streak = (habit.streak || 0) + 1;
                else if (targetStatus === 'failed') habit.streak = 0;
            }

            saveRoomState(roomData);
        }

        function deleteHabit(habitId) {
            const roomData = getRoomState();
            if (roomData.members[myUserId]) {
                roomData.members[myUserId].habits = roomData.members[myUserId].habits.filter(h => h.id !== habitId);
                saveRoomState(roomData);
            }
        }

        function changeDate(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            render();
        }

        function resetToToday() {
            currentDate = new Date();
            render();
        }

        // Inline Service Worker
        if ('serviceWorker' in navigator) {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => self.clients.claim());
            self.addEventListener('fetch', (e) => {
              e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
            });
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // App Starten
        initApp();
    </script>
</body>
</html>
