<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalTribe</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            earth: {
              50: '#fbf9f5', 100: '#f7f3eb', 200: '#efe6d5', 300: '#e2d3b8',
              400: '#d1b993', 500: '#c19f72', 600: '#b08757', 700: '#926c44',
              800: '#77573b', 900: '#614732', 950: '#342419',
            },
            sage: { 50: '#f4f7f4', 500: '#628a67', 600: '#4d7052' },
            rose: { 50: '#fcf5f5', 500: '#c25959', 700: '#993d3d' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-earth-100 text-earth-950 min-h-screen pb-12">

  <div id="app" class="max-w-md mx-auto p-4 space-y-4">
    <!-- Hier rendert deine App dynamisch die Inhalte -->
  </div>

  <script>
    // LocalStorage Helper
    function getRoomState() {
      const data = localStorage.getItem("goaltribe_state");
      if (data) return JSON.parse(data);
      
      const defaultState = {
        members: {
          "user_1": {
            name: "Ich",
            habits: []
          }
        }
      };
      localStorage.setItem("goaltribe_state", JSON.stringify(defaultState));
      return defaultState;
    }

    function saveRoomState(state) {
      localStorage.setItem("goaltribe_state", JSON.stringify(state));
    }

    const myUserId = "user_1";
    const currentDate = new Date();

    function getFormattedDateKey(date) {
      return date.toISOString().split('T')[0];
    }

    // App Render Logik
    function render() {
      const app = document.getElementById("app");
      const roomData = getRoomState();
      const myMember = roomData.members[myUserId] || { habits: [] };
      const habitsList = myMember.habits || [];
      const dateKey = getFormattedDateKey(currentDate);

      let habitsHTML = habitsList.map(habit => {
        const status = (habit.history && habit.history[dateKey]) ? habit.history[dateKey] : "pending";
        const isDone = status === 'done';
        const isFailed = status === 'failed';
        const streak = habit.streak || 0;

        return `
          <div class="p-2.5 rounded-xl bg-earth-50/60 border border-earth-200/50 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <span class="font-medium text-earth-800">${habit.name}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md ${streak > 0 ? 'bg-amber-100 text-amber-800' : 'bg-earth-100 text-earth-800 opacity-60'}">
                🔥 ${streak}
              </span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="setHabitStatus('${habit.id}', 'done')" class="w-8 h-8 rounded-lg flex items-center justify-center transition border ${isDone ? 'bg-sage-600 text-white' : 'bg-earth-100 text-earth-700'}">
                <i class="fa-solid fa-arrow-up text-xs"></i>
              </button>
              <button onclick="setHabitStatus('${habit.id}', 'failed')" class="w-8 h-8 rounded-lg flex items-center justify-center transition border ${isFailed ? 'bg-rose-700 text-white' : 'bg-earth-100 text-earth-700'}">
                <i class="fa-solid fa-arrow-down text-xs"></i>
              </button>
              <button onclick="deleteHabit('${habit.id}')" class="w-6 h-6 text-earth-300 hover:text-rose-500 transition ml-1">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");

      if (habitsList.length === 0) {
        habitsHTML = `<p class="text-xs text-sage-500 italic py-1">Noch keine Aktivitäten eingetragen.</p>`;
      }

      app.innerHTML = `
        <div class="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm border border-earth-200 space-y-3">
          <h1 class="text-lg font-bold text-earth-900 flex items-center gap-2">
            🌱 GoalTribe
          </h1>
          
          <div class="flex gap-2">
            <input id="input-new-habit" type="text" placeholder="Neue Aktivität..." class="flex-1 px-3 py-2 text-xs bg-earth-50 border border-earth-200 rounded-xl focus:outline-none focus:border-sage-500">
            <button onclick="addHabit()" class="px-4 py-2 bg-sage-600 hover:bg-sage-500 text-white font-medium text-xs rounded-xl transition flex items-center gap-1">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>

          <div class="space-y-1.5 pt-1">
            ${habitsHTML}
          </div>
        </div>
      `;
    }

    // Aktionen
    function addHabit() {
      const input = document.getElementById("input-new-habit");
      if (!input) return;
      const name = input.value.trim();
      if (!name) return;

      // 1. An Firebase schicken
      if (typeof window.addHabitToFirebase === 'function') {
        window.addHabitToFirebase(name);
      }

      // 2. Lokaler Fallback für die sofortige Anzeige
      const roomData = getRoomState();
      if (roomData && roomData.members && roomData.members[myUserId]) {
        roomData.members[myUserId].habits.push({
          id: "h_" + Date.now(),
          name: name,
          streak: 0,
          history: {}
        });
        saveRoomState(roomData);
        render();
      }

      input.value = "";
    }

    function setHabitStatus(habitId, targetStatus) {
      const dateKey = getFormattedDateKey(currentDate);
      const roomData = getRoomState();
      const myMember = roomData.members[myUserId];
      const habit = myMember.habits.find(h => h.id === habitId);

      if (habit) {
        if (!habit.history) habit.history = {};
        habit.history[dateKey] = targetStatus;
        saveRoomState(roomData);
        render();
      }
    }

    function deleteHabit(habitId) {
      const roomData = getRoomState();
      const myMember = roomData.members[myUserId];
      myMember.habits = myMember.habits.filter(h => h.id !== habitId);
      saveRoomState(roomData);
      render();
    }

    // Initialer Start
    render();
  </script>

  <!-- FIREBASE INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxLn_b8s5DHaa7uMfBghyaC-dnHbl55yY",
      authDomain: "goaltribe-67.firebaseapp.com",
      projectId: "goaltribe-67",
      storageBucket: "goaltribe-67.firebasestorage.app",
      messagingSenderId: "120927875905",
      appId: "1:120927875905:web:3698affe6dfbcfd47c67c0",
      measurementId: "G-DPZYV23GHX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Globale Firebase-Speicher-Funktion
    window.addHabitToFirebase = async function(title) {
      try {
        await addDoc(collection(db, "habits"), {
          name: title,
          createdAt: new Date()
        });
        console.log("Erfolgreich in Firebase gespeichert!");
      } catch (e) {
        console.error("Fehler beim Speichern in Firebase:", e);
      }
    };
  </script>
</body>
</html>
